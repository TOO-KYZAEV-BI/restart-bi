<style>
/* Раскладка: графитовое боковое меню + рабочая область. Акцент — бирюза; у каждого направления свой цвет (медь RestArt, синий Klen Market, фиолетовый Italbrands). Семантика (хорошо/внимание/плохо) — отдельно от акцента. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --surface-2:#f8faf9; --surface-3:#ebefed; --line:#dfe5e2; --line-2:#c9d2ce;
  --fg:#14201d; --fg-2:#44534f; --fg-3:#5f6e6a; --fg-inv:#ffffff;
  --accent:#0b7a69; --accent-soft:#e2f2ee; --accent-ink:#ffffff;
  --side:#15201e; --side-2:#1c2a27; --side-fg:#d7e1de; --side-muted:#93a6a1; --side-line:#263633; --side-on:#24352f; --side-accent:#4fd1b5;
  --d-ra:#b5551c; --d-km:#2560b4; --d-ib:#7445bd;
  --good:#17803f; --good-soft:#e5f4ea; --warn:#a85f05; --warn-soft:#fcf1dd; --bad:#c0352b; --bad-soft:#fbe9e7; --info:#2457c5; --info-soft:#e8eefb;
  --c1:#2457c5; --c2:#c47a12; --c3:#1f7a4d; --c4:#b83a2f; --c5:#6d4cc4; --c6:#0e7c89; --c7:#636b78;
  --age-0:#17803f; --age-1:#b07d0e; --age-2:#d0601a; --age-3:#c62828; --age-4:#7f1d1d;
  --tile-dark:#15201e; --tile-dark-fg:#eef4f2; --tile-dark-muted:#a9bbb6; --spark:#4fd1b5;
  --font:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif; --display:"Unbounded","Onest",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r-sm:6px; --r:10px; --r-lg:14px; --sh:0 10px 30px rgba(14,30,26,.14); --sh-lg:0 24px 70px rgba(10,20,18,.28); --scrim:rgba(8,16,14,.5);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d1413; --surface:#141d1b; --surface-2:#18221f; --surface-3:#1e2a27; --line:#27332f; --line-2:#34433f;
  --fg:#e5ecea; --fg-2:#a7b5b1; --fg-3:#8d9d98; --accent:#3cc2a6; --accent-soft:#12302a; --accent-ink:#06201b;
  --side:#0a100f; --side-2:#111a18; --side-line:#1c2725; --side-on:#182623;
  --d-ra:#e58a4e; --d-km:#6a9ae6; --d-ib:#a888ee;
  --good:#4cc47d; --good-soft:#123222; --warn:#e5a540; --warn-soft:#33260f; --bad:#f07a6e; --bad-soft:#3a1916; --info:#7aa2f7; --info-soft:#142238;
  --c1:#6f9ae8; --c2:#e0a13a; --c3:#4cb882; --c4:#ef7a6e; --c5:#a68cf0; --c6:#3fb6c4; --c7:#9aa3b2;
  --age-0:#3fb06c; --age-1:#d9a21b; --age-2:#e0701f; --age-3:#ef6a5e; --age-4:#ff9a8f;
  --tile-dark:#1d2d29; --tile-dark-fg:#eef4f2; --tile-dark-muted:#a9bbb6; --sh:0 10px 30px rgba(0,0,0,.5); --sh-lg:0 24px 70px rgba(0,0,0,.6); --scrim:rgba(0,0,0,.6); color-scheme:dark } }
:root[data-theme="dark"]{

  --fg:#e5ecea; --fg-2:#a7b5b1; --fg-3:#8d9d98; --accent:#3cc2a6; --accent-soft:#12302a; --accent-ink:#06201b;
  --side:#0a100f; --side-2:#111a18; --side-line:#1c2725; --side-on:#182623;
  --d-ra:#e58a4e; --d-km:#6a9ae6; --d-ib:#a888ee;
  --good:#4cc47d; --good-soft:#123222; --warn:#e5a540; --warn-soft:#33260f; --bad:#f07a6e; --bad-soft:#3a1916; --info:#7aa2f7; --info-soft:#142238;
  --c1:#6f9ae8; --c2:#e0a13a; --c3:#4cb882; --c4:#ef7a6e; --c5:#a68cf0; --c6:#3fb6c4; --c7:#9aa3b2;

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--font);margin:0;font-variant-numeric:tabular-nums lining-nums}
a{color:var(--info)} button,select,input{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;min-height:100%}

/* меню */
.side{width:252px;flex:0 0 252px;background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto;padding-block:16px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:12px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 14px}
.brand .mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--d-ra),var(--accent));display:grid;place-items:center;color:#fff;font:700 15px/1 var(--display);flex:0 0 auto}
.brand b{display:block;font:700 15px/1.1 var(--display);letter-spacing:.04em;color:#fff}
.brand small{display:block;font-size:11px;color:var(--side-muted);margin-top:3px}
.sideclose{display:none;margin-left:auto;border:0;background:transparent;color:#fff;font-size:22px;width:40px;height:40px;cursor:pointer}
.nav{display:flex;flex-direction:column;gap:2px}
.grp{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--side-muted);padding:12px 10px 4px;border-top:1px solid var(--side-line);margin-top:6px}
.nav .grp:first-child{border-top:0;margin-top:0;padding-top:2px}
.nav a{position:relative;display:flex;align-items:center;gap:10px;min-height:36px;padding:4px 10px;border-radius:var(--r-sm);color:var(--side-fg);text-decoration:none;font-weight:500;font-size:14.5px}
.nav a.pri{font-weight:650}
.nav a:hover{background:var(--side-2);color:#fff}
.nav a.on{background:var(--side-on);color:#fff;font-weight:700}
.nav a.on::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--side-accent)}
.nav svg{width:17px;height:17px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.nav a.on svg{color:var(--side-accent);opacity:1}
.nav .st{margin-left:auto;font-size:11px;font-weight:800;background:#7a2a22;color:#fff;border-radius:999px;padding:0 7px;line-height:18px}
.me{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--side-line);display:flex;gap:10px;align-items:flex-start}
.me .av{width:32px;height:32px;border-radius:50%;background:var(--side-on);display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;flex:0 0 auto}
.me .mecol{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
.me b{font-size:13px;color:#fff;line-height:1.2}.me small{font-size:11px;color:var(--side-muted)}
.me label{font-size:11px;color:var(--side-muted);display:flex;flex-direction:column;gap:3px}
.me select{background:var(--side-2);color:var(--side-fg);border:1px solid var(--side-line);border-radius:var(--r-sm);padding:4px 6px;font-size:12.5px;max-width:100%}

/* рабочая область */
.main{flex:1;min-width:0;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.burger{display:none;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);min-height:40px;padding:0 12px;font-weight:700;cursor:pointer}
.dseg{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:3px;max-width:100%}
.dseg button{border:0;background:transparent;border-radius:var(--r-sm);padding:6px 12px;font-weight:650;font-size:13px;color:var(--fg-2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.dseg button[style]::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dc)}
.dseg button.on{background:var(--tile-dark);color:var(--tile-dark-fg)}
.topbar select,.topbar input[type=date]{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;min-height:38px;font-weight:600;font-size:13px;max-width:100%}
.custom{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--fg-3)}
.btn-q{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:5px 10px;font-weight:650;font-size:12.5px;cursor:pointer;color:var(--fg-2);white-space:nowrap}
.btn-q:hover:not(:disabled){background:var(--surface-3);color:var(--fg)} .btn-q:disabled{opacity:.4;cursor:default}
.btn-p,.btn-s,.btn-danger{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:var(--r-sm);font-weight:700;font-size:13px;cursor:pointer;border:1px solid transparent;white-space:nowrap}
.btn-p{background:var(--accent);color:var(--accent-ink)} .btn-p:hover:not(:disabled){filter:brightness(1.08)}
.btn-s{background:var(--surface);border-color:var(--line-2);color:var(--fg)} .btn-s:hover{background:var(--surface-3)}
.btn-danger{background:var(--bad);color:#fff}
.btn-p:disabled{opacity:.55;cursor:wait}
.frow2{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px}
.rangeline{margin-top:8px;font-size:12px;color:var(--fg-3);display:flex;flex-wrap:wrap;gap:4px 12px}
.rangeline b{color:var(--fg)}
.up{color:var(--good)} .dn{color:var(--bad)} .wn{color:var(--warn)}

.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin:16px 0 14px}
.phead h1{font:700 24px/1.15 var(--display);letter-spacing:-.01em}
.sub{margin:6px 0 0;color:var(--fg-3);font-size:13px;max-width:80ch}
.pact{display:flex;flex-wrap:wrap;gap:8px}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs a{padding:4px 2px 9px;color:var(--fg-3);text-decoration:none;font-weight:700;font-size:13.5px;white-space:nowrap}
.tabs a.on{color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}

/* плитки */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
@media (min-width:1200px){.tiles.k12{grid-template-columns:repeat(4,minmax(0,1fr))}.tiles.k4{grid-template-columns:repeat(4,minmax(0,1fr))}.tiles.k5{grid-template-columns:repeat(5,minmax(0,1fr))}}
.tile{all:unset;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 12px;display:flex;flex-direction:column;gap:4px;min-width:0;box-shadow:inset 3px 0 0 var(--stripe,transparent);font-family:var(--font)}
.tile.lnk{cursor:pointer;transition:box-shadow .15s,transform .15s}
.tile.lnk:hover{box-shadow:var(--sh),inset 3px 0 0 var(--stripe,transparent);transform:translateY(-1px)}
.tile.lnk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile .t{font-size:13px;font-weight:650;color:var(--fg-2)}
.tile .v{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15;color:var(--fg)}
.tile .d{font-size:12px;color:var(--fg-3)}
.tile.dark{background:var(--tile-dark);border-color:transparent;--fg:var(--tile-dark-fg);--fg-2:var(--tile-dark-muted);--fg-3:var(--tile-dark-muted)}
.tile.dark .up{color:#6fdc9c}.tile.dark .dn{color:#ff9a8f}
.trio{display:flex;gap:12px;font-size:20px;white-space:nowrap}.trio span+span{border-left:1px solid var(--line);padding-left:14px}
.spark{width:100%;height:30px;display:block;margin-top:4px}
.lock{font-size:12px;font-weight:700;color:var(--fg-3);background:var(--surface-3);border-radius:999px;padding:2px 8px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px;min-width:0}
.card.frow{display:grid}
.chd{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
.chd h2{font-size:15px;font-weight:800}.chd h2 small{font-weight:600;color:var(--fg-3);font-size:12.5px}
.cmeta{font-size:12px;color:var(--fg-3)}
.card h3{font-size:13.5px;font-weight:800;margin:14px 0 8px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:0 14px}
.note{font-size:12.5px;color:var(--fg-3);margin:10px 0 0} .small{font-size:12.5px;color:var(--fg-3);margin:0}
.lead{font-size:14.5px;line-height:1.6;margin:0;max-width:72ch}
.ul{margin:0;padding-left:18px;line-height:1.6;font-size:13.5px} .ul.tight li{margin:1px 0}
.banner-info,.banner-warn,.banner-bad{border-radius:var(--r);padding:10px 14px;margin:0 0 12px;font-size:13px}
.banner-info{background:var(--info-soft);color:var(--fg);box-shadow:inset 3px 0 0 var(--info)}
.banner-warn{background:var(--warn-soft);color:var(--fg);box-shadow:inset 3px 0 0 var(--warn)}
.banner-bad{background:var(--bad-soft);color:var(--fg);box-shadow:inset 3px 0 0 var(--bad)}
.empty{text-align:center;color:var(--fg-3);padding:24px 8px}

/* таблицы */
.tbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
.tsearch{display:flex;align-items:center;gap:6px;flex:1 1 220px;max-width:380px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:5px 10px;color:var(--fg-3)}
.tsearch svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}
.tsearch input{border:0;background:transparent;outline:none;flex:1;min-width:0;font-size:13px}
.tbar select{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:5px 8px;font-size:12.5px}
.tcount{font-size:12px;color:var(--fg-3);margin-right:auto}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:12px;font-weight:650;color:var(--fg-2);padding:7px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap;vertical-align:bottom;background:var(--surface)}
.tbl th[data-sort]{cursor:pointer;user-select:none}
.tbl th[aria-sort=ascending]::after{content:" ↑"} .tbl th[aria-sort=descending]::after{content:" ↓"}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl .num{text-align:right;white-space:nowrap;font-weight:600}
.tbl tr.total td{background:var(--surface-3);font-weight:750}
.tbl tr.rowlink{cursor:pointer} .tbl tr.rowlink:hover td{background:var(--accent-soft)}
.tbl.compact td,.tbl.compact th{padding:5px 8px;font-size:12.5px}
.tbl small{color:var(--fg-3)}
.doc{font-family:var(--mono);font-size:12px;color:var(--fg-2);white-space:nowrap}
a.doc{color:var(--info)}
.pager{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:8px;font-size:12.5px;color:var(--fg-3)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px;white-space:nowrap}
.p-good{background:var(--good-soft);color:var(--good)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--info-soft);color:var(--info)} .p-mute{background:var(--surface-3);color:var(--fg-3)}
.dchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--fg);white-space:nowrap}
.dchip::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--dc)}
.bar{display:inline-block;width:70px;height:7px;background:var(--surface-3);border-radius:4px;overflow:hidden;vertical-align:middle}.bar i{display:block;height:100%}
.tbl.pl td.pl-n{min-width:260px}
.tbl.pl tr.sec td{font-weight:800;border-top:1px solid var(--line-2)}
.tbl.pl tr.sub td{color:var(--fg-2);font-size:12.5px} .tbl.pl tr.sub td.pl-n{padding-left:24px}
.tbl.pl tr.tot td{background:var(--surface-3);font-weight:800}
.tbl.pl tr.net td{box-shadow:inset 0 2px 0 var(--fg-3)}
.tbl.pl tr.pct td{font-style:italic;color:var(--fg-3)}
@media (max-width:1300px){.tbl .xl{display:none}}

/* воронка статусов */
.funnel{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 2px}
.funnel button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;color:var(--fg-2);cursor:pointer}
.funnel button i{font-style:normal;font-size:10.5px;font-weight:800;background:var(--surface-3);border-radius:50%;width:17px;height:17px;display:grid;place-items:center}
.funnel button b{color:var(--fg)}
.funnel button.on{background:var(--tile-dark);color:var(--tile-dark-fg);border-color:transparent}.funnel button.on b{color:inherit}.funnel button.on i{background:rgba(255,255,255,.16)}

/* графики */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1} .chart .zero{stroke:var(--fg-3);stroke-width:1}
.chart .ax{fill:var(--fg-3);font-size:12px;font-family:var(--font)} .chart .strong{fill:var(--fg);font-weight:700}
.chart .hit{cursor:pointer} .chart .hit:hover{fill:var(--accent);fill-opacity:.07}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--fg-3);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut svg{width:150px;height:150px;flex:0 0 auto} .donut .ax{fill:var(--fg-3);font-size:10px} .donut .dv{fill:var(--fg);font-size:15px;font-weight:800}
.donut path.hit{cursor:pointer} .donut path.hit:hover{opacity:.85}
.dl{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1;font-size:13px}
.dl{flex:1 1 170px}
.dl>div{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center;padding:2px 4px;border-radius:var(--r-sm)}
.dl i{width:10px;height:10px;border-radius:2px} .dl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .dl b{white-space:nowrap;text-align:right} .dl small{color:var(--fg-3);font-weight:500;margin-left:6px}
.lnkrow{cursor:pointer} .lnkrow:hover{background:var(--accent-soft)}
.hbars{display:flex;flex-direction:column;gap:3px}
.hbars>div{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.6fr) auto;gap:10px;align-items:center;font-size:13px;padding:3px 4px;border-radius:var(--r-sm)}
.hbars .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg-2)}
.hbars .b{height:10px;background:var(--surface-3);border-radius:5px;overflow:hidden}.hbars .b i{display:block;height:100%;border-radius:5px}
.hbars .v{font-weight:700;white-space:nowrap}.hbars .v small{font-weight:500;color:var(--fg-3)}

/* проекты */
.objs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:14px}
.obj{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--d-ra);border-radius:var(--r);padding:12px 14px;cursor:pointer;font-family:var(--font);min-width:0}
.obj:hover{box-shadow:var(--sh)} .obj:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.obj .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.obj .hd b{font-size:14.5px;line-height:1.3}
.obj .cust{font-size:12px;color:var(--fg-3)}
.obj .steps{display:flex;gap:3px}.obj .steps i{flex:1;height:5px;border-radius:3px;background:var(--surface-3)}.obj .steps i.ok{background:var(--good)}.obj .steps i.now{background:var(--d-ra)}
.obj .rows{display:flex;flex-direction:column}
.obj .rows>span{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-top:1px solid var(--line);font-size:12.5px}
.obj .rows>span>span:first-child{color:var(--fg-3)} .obj .rows>span>span:last-child{font-weight:700;text-align:right}

/* карточки */
.kv{display:grid;grid-template-columns:minmax(150px,38%) 1fr;gap:6px 14px;margin:4px 0 8px;font-size:13.5px}
.kv dt{color:var(--fg-3);font-weight:600}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.route{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px;margin:10px 0}
.route i{color:var(--fg-3);font-style:normal}
.route .rt{padding:2px 9px;border-radius:999px;background:var(--surface-3);color:var(--fg-3);white-space:nowrap}
.route .rt.ok{color:var(--good);background:var(--good-soft)} .route .rt.now{background:var(--tile-dark);color:var(--tile-dark-fg)}
.evt{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.evt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.evt.bad{color:var(--bad)}
.mact{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.ph{display:inline-block;font-size:12px;color:var(--fg-3);border:1px dashed var(--line-2);border-radius:var(--r-sm);padding:6px 12px}

/* формы */
.opf{display:flex;flex-direction:column;gap:12px}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:650;color:var(--fg-2);min-width:0}
.fld small{font-weight:500;color:var(--fg-3)}
.fld input:not([type=checkbox]),.fld select{font-size:14px;font-weight:500;color:var(--fg);background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:7px 10px;min-height:38px;width:100%;min-width:0}
.fld.chk{flex-direction:row;align-items:center;gap:8px;min-height:38px}
.ferr{color:var(--bad);font-weight:650;font-size:13px;margin:0;min-height:1em}

/* отчёты, роли, выключатели, проверки */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.rcard{display:grid;grid-template-columns:30px 1fr;gap:2px 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-decoration:none;color:var(--fg)}
.rcard:hover{border-color:var(--accent);box-shadow:var(--sh)}
.rcard i{grid-row:span 2;font-style:normal;font:700 13px/30px var(--display);text-align:center;background:var(--accent-soft);color:var(--accent);border-radius:8px;height:30px}
.rcard b{font-size:14px}.rcard small{color:var(--fg-3);font-size:12.5px}
.rcard.off{opacity:.5;pointer-events:none}
.matrix th.lv span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;font-size:11.5px}
.matrix td.lv{text-align:center;font-weight:800;min-width:42px}
.matrix .lП{background:var(--good-soft);color:var(--good)} .matrix .lБ{background:var(--info-soft);color:var(--info)} .matrix .lЧ{background:var(--surface-3);color:var(--fg-2)} .matrix .lС{background:var(--accent-soft);color:var(--accent)}
.matrix .me{box-shadow:inset 0 0 0 2px var(--accent)}
.mtw{max-height:72vh}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px}
.swi{display:grid;grid-template-columns:auto 1fr;gap:0 10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);cursor:pointer}
.swi input{grid-row:span 2;width:18px;height:18px;accent-color:var(--accent)}
.swi span{font-weight:650;font-size:13px}.swi small{color:var(--fg-3);font-size:11.5px}
.checks{display:flex;flex-direction:column;gap:8px}
.chk{display:grid;grid-template-columns:34px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.chk>i{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px}
.chk.ok>i{background:var(--good-soft);color:var(--good)} .chk.bad>i{background:var(--bad-soft);color:var(--bad)} .chk.wait>i{background:var(--surface-3);color:var(--fg-3)}
.chk b{font-size:14px}.chk p{margin:4px 0 0;font-size:13px;color:var(--fg-2);line-height:1.5}
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.stages b{font-size:13.5px}

/* модальное окно и уведомления */
.modal{position:fixed;inset:0;background:var(--scrim);z-index:50;display:grid;place-items:center;padding:16px}
.mbox{background:var(--surface);color:var(--fg);border-radius:var(--r-lg);width:100%;max-width:640px;max-height:88vh;overflow:auto;padding:0 18px 18px;box-shadow:var(--sh-lg)}
.mbox.wide{max-width:1000px}
.mbox header{position:sticky;top:0;z-index:2;background:var(--surface);display:flex;align-items:center;gap:8px;padding:16px 0 10px;border-bottom:1px solid var(--line);margin-bottom:12px}
.mbox header span{font-weight:800;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mbox header button{border:0;background:transparent;font-size:20px;cursor:pointer;width:36px;height:36px;border-radius:var(--r-sm);color:var(--fg)}
.mbox header button:hover{background:var(--surface-3)} #mClose{margin-left:auto}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;max-width:min(420px,calc(100vw - 32px))}
.toast{background:var(--tile-dark);color:var(--tile-dark-fg);padding:10px 14px;border-radius:var(--r);box-shadow:var(--sh-lg);font-size:13px;font-weight:600}
.toast.bad{background:var(--bad);color:#fff}
.foot{margin-top:24px;font-size:12px;color:var(--fg-3)}

@media (max-width:900px){
  .side{position:fixed;left:0;top:0;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none;box-shadow:0 0 0 100vmax var(--scrim)}
  .sideclose{display:block} .burger{display:inline-block}
  .main{padding-top:max(12px,env(safe-area-inset-top,0px))}
  .modal{padding:0;place-items:stretch} .mbox,.mbox.wide{max-width:none;max-height:none;height:100%;border-radius:0}
  .mbox header{padding-top:max(14px,env(safe-area-inset-top,0px))}
  .tbl td:first-child,.tbl th:first-child{position:sticky;left:0;background:var(--surface);z-index:1;box-shadow:1px 0 0 var(--line)}
  .tbl tr.total td:first-child{background:var(--surface-3)}
}
@media (max-width:560px){
  .phead h1{font-size:19px} .tile .v{font-size:23px} .trio{font-size:17px;gap:8px}.trio span+span{padding-left:8px}
  .tbl .lo{display:none} .kv{grid-template-columns:1fr} .kv dt{margin-top:4px}
  .two{grid-template-columns:1fr} .dseg button{padding:6px 8px}
  .hbars>div{grid-template-columns:minmax(0,1fr) auto}.hbars .b{grid-column:1/-1;order:3}
}

/* ИИ-помощник */
.aibtn{display:grid;grid-template-columns:auto 1fr;gap:0 8px;align-items:center;text-align:left;margin:0 0 10px;padding:9px 12px;border-radius:var(--r);border:1px solid #2f4a44;background:linear-gradient(100deg,#1f3a34,#18302b);color:#fff;font-weight:750;font-size:14px;cursor:pointer;width:100%}
.aibtn span{grid-row:span 2;font-size:18px;color:var(--side-accent)} .aibtn small{font-weight:500;font-size:11px;color:var(--side-muted)}
.aibtn:hover{border-color:var(--side-accent)}
.aitop{border-color:var(--accent);color:var(--accent);font-weight:750}
.aip{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);z-index:45;background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--sh-lg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.aip header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.aip header div{flex:1;min-width:0} .aip header b{display:block;font-size:15px} .aip header small{display:block;font-size:12px;color:var(--fg-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aip header #aiClose{border:0;background:transparent;font-size:22px;width:40px;height:40px;border-radius:var(--r-sm);cursor:pointer;color:var(--fg)}
.aimark{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:17px}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:94%;padding:9px 12px;border-radius:14px;font-size:13.5px;line-height:1.5;overflow-wrap:anywhere}
.m.u{align-self:flex-end;background:var(--tile-dark);color:var(--tile-dark-fg);border-bottom-right-radius:4px;white-space:pre-wrap}
.m.a{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:4px;width:94%}
.m.a .who{display:block;font-size:11.5px;color:var(--accent);margin-bottom:3px}
.m.a p{margin:4px 0} .m.a ul{margin:4px 0;padding-left:18px} .m.a li{margin:2px 0} .m.a code{font-family:var(--mono);font-size:12px}
.m.a .tw{margin:6px 0}
.think{color:var(--fg-3);animation:skel 1.2s ease-in-out infinite} @keyframes skel{50%{opacity:.45}}
.tools{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px} .tools span{font-size:11.5px;color:var(--fg-3);background:var(--surface-3);border-radius:999px;padding:1px 8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 14px 8px;flex-wrap:nowrap}
.chips button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;color:var(--fg-2);white-space:nowrap}
.chips button:hover{border-color:var(--accent);color:var(--fg)}
.ask{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);align-items:flex-end}
.ask textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line-2);border-radius:var(--r);padding:8px 10px;font:inherit;font-size:14px;background:var(--surface-2);color:var(--fg);max-height:140px}
.ainote{margin:0;padding:0 14px 10px;font-size:11.5px;color:var(--fg-3)}
@media (prefers-reduced-motion:reduce){.think{animation:none}}
@media (min-width:1280px){body.ai-open .main{padding-right:476px}}
@media (prefers-reduced-motion:reduce){.side,.tile.lnk{transition:none}.tile.lnk:hover{transform:none}}
